spring:
  application:
    name: delivery-service
  data:
    mongodb:
      host: ${DELIVERY_MONGODB_HOST:localhost}
      port: ${DELIVERY_MONGODB_PORT:5435}
      database: ${DELIVERY_MONGODB_DATABASE:delivery_db}
      username: ${DELIVERY_MONGODB_USERNAME:delivery_db}
      password: ${DELIVERY_MONGODB_PASSWORD:delivery}
      authentication-database: admin
    redis:
      sentinel:
        master:
          host: localhost
          port: 6379
        nodes:
          - localhost:26379
          - localhost:26380
          - localhost:26381
      timeout: 10000

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      ack-mode: manual
eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/
    register-with-eureka: true
    fetch-registry: true

kafka:
  topic:
    delivery-create-response: delivery-create-response
    delivery-create-failure: delivery-create-failure
    delivery-delete-failure: delivery-delete-failure
    delivery-end-response: delivery-end-response
    email-create-request: email-create-request

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 20s

server:
  port: 19096

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0