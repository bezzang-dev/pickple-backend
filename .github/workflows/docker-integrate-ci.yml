name: Integrated Docker Services Test

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  integrate-test:

    runs-on: ubuntu-latest
    env:
      SLACK_WORKSPACE_URL: ${{ secrets.SLACK_WORKSPACE_URL }}
      WEBHOOK_FOR_SERVER: ${{ secrets.WEBHOOK_FOR_SERVER }}
      WEBHOOK_FOR_TRAFFIC: ${{ secrets.WEBHOOK_FOR_TRAFFIC }}
      LOKI_URL: http://localhost:3100/loki/api/v1/push
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ELK Repository에서 ELK 환경 setup
        uses: actions/checkout@v4
        with: 
          repository: pickple-ecommerce/docker-elk
          path: temp-config-secrets

      - name: Run docker-compose up -d
        working-directory: temp-config-secrets
        run: |
          docker compose up setup
          docker compose up -d --build

      - name: Docker Compose로 서비스 실행
        run: |
          docker compose -f docker/docker-compose.dev.yml up -d

      - name: Wait for Kafka to be ready
        run: |
          echo "Waiting for Kafka..."
          until docker exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1; do
            echo "  Kafka not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "Kafka is ready."

      - name: Wait for PostgreSQL (user_db) to be ready
        run: |
          echo "Waiting for user_db PostgreSQL..."
          until docker exec user_db pg_isready -U user_db > /dev/null 2>&1; do
            echo "  user_db not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "user_db is ready."

      - name: Wait for Redis to be ready
        run: |
          echo "Waiting for Redis master..."
          until docker exec redis-master redis-cli ping 2>/dev/null | grep -q PONG; do
            echo "  Redis not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "Redis is ready."

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle Wrapper in root directory
        run: chmod +x ./gradlew

      - name: Build and Start Eureka Server
        run: |
          cd eureka-server
          chmod +x ./gradlew # Grant execute permission within the eureka-server directory
          ./gradlew bootJar
          nohup java -jar build/libs/eureka-server-0.0.1-SNAPSHOT.jar &
          cd ..
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Wait for Eureka Server to be ready
        run: |
          echo "Waiting for Eureka Server..."
          until curl -s http://localhost:${EUREKA_SERVER_PORT:-8761}/actuator/health 2>/dev/null | grep -q '"status":"UP"'; do
            echo "  Eureka not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "Eureka Server is ready."

      - name: Build Gradle Project
        run: ./gradlew build -Dspring.profiles.active=dev
