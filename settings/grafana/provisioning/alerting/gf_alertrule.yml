apiVersion: 1
groups:
  - orgId: 1
    name: server
    folder: pickple
    interval: 30s
    rules:
      - uid: ee0x3l4g5qkn4d
        title: server-alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              disableTextWrap: false
              editorMode: builder
              expr: up{job="eureka-server"}
              fullMetaSearch: false
              includeNullMetadata: true
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
              useBackend: false
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          alertname : ServerAlert
          instance : eureka-server
          severity: critical
        annotations:
          summary: 서버 상태 경고
          description: eureka 서버가 응답하지 않습니다.
        isPaused: false
        notification_settings:
          receiver: server-channel

  - orgId: 1
    name: traffic
