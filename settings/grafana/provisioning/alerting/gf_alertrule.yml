  - orgId: 1
    name: kafka-lag
    folder: pickple
    interval: 1m
    rules:
      - uid: kafka_consumer_lag_alert
        title: kafka-consumer-lag-alert
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sum by (job) (kafka_consumer_fetch_manager_records_lag_max)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          alertname: KafkaConsumerLag
          severity: warning
        annotations:
          summary: Kafka Consumer Lag 경고
          description: Kafka Consumer lag이 1000을 초과했습니다. 메시지 처리 지연이 발생 중입니다.
        isPaused: false
        notification_settings:
          receiver: server-channel

  - orgId: 1
